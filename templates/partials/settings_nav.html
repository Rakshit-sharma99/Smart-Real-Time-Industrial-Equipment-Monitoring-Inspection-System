{# Tabs on every Settings page. Manager-only tabs are hidden for other roles (and the views refuse them anyway). #}
<ul class="nav nav-underline settings-nav mb-3">
  {% if is_manager_user %}
    <li class="nav-item"><a class="nav-link{% if settings_tab == 'restaurant' %} active{% endif %}" href="{% url 'core:restaurant_settings' %}">Restaurant</a></li>
    <li class="nav-item"><a class="nav-link{% if settings_tab == 'sections' %} active{% endif %}" href="{% url 'core:sections' %}">Sections</a></li>
    <li class="nav-item"><a class="nav-link{% if settings_tab == 'cameras' %} active{% endif %}" href="{% url 'cctv:camera_list' %}">Cameras &amp; AI</a></li>
  {% endif %}
  <li class="nav-item"><a class="nav-link{% if settings_tab == 'profile' %} active{% endif %}" href="{% url 'accounts:profile' %}">My profile</a></li>
  <li class="nav-item"><a class="nav-link{% if settings_tab == 'password' %} active{% endif %}" href="{% url 'accounts:password_change' %}">Password</a></li>
</ul>
