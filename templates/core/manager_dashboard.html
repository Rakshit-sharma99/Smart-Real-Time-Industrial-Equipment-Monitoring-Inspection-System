{% extends "base.html" %}
{% block content %}
<div class="page-header mb-3">
  <div><h2>{{ request.restaurant.name }}</h2><p class="subtitle">Live operating condition · {% now "l, d F" %}</p></div>
  <div class="page-actions">
    <a class="btn btn-outline-secondary" href="{% url 'reports:home' %}"><i class="bi bi-bar-chart-line" aria-hidden="true"></i> Reports</a>
    <a class="btn btn-primary" href="{% url 'tasks:create' %}"><i class="bi bi-plus-lg" aria-hidden="true"></i> Waiter task</a>
  </div>
</div>
<div class="row g-3">
  <div class="col-xxl-8">
    <div data-live-fragment="{% url 'core:fragment_overview' %}" data-live-topics="tables tasks reservations">
      {% include "core/_overview_live.html" %}
    </div>
  </div>
  <div class="col-xxl-4">
    <div data-live-fragment="{% url 'core:fragment_panels' %}" data-live-topics="tasks reservations tables cameras">
      {% include "core/_panels.html" %}
    </div>
  </div>
</div>
{% endblock %}
