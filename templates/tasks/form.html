{% extends "base.html" %}
{% block content %}
<div class="row"><div class="col-lg-7 col-xl-5">
  <div class="card">
    <div class="card-header">New waiter task{% if table %} for {{ table.label }}{% endif %}</div>
    <div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "partials/form_errors.html" %}
        {% for field in form %}{% include "partials/form_field.html" %}{% endfor %}
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Create task</button>
          <a class="btn btn-outline-secondary" href="{% if table %}{{ table.get_absolute_url }}{% else %}{% url 'tasks:list' %}{% endif %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
