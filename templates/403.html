{% extends user.is_authenticated|yesno:"base.html,base_minimal.html" %}
{% block content %}
<div class="error-page">
  <i class="bi bi-shield-lock" aria-hidden="true"></i>
  <p class="error-code">403</p>
  <h2 class="h4">You don't have access to this</h2>
  <p class="text-body-secondary">{{ reason|default:"Your role does not allow this action." }} If you think this is a mistake, ask your manager.</p>
  <a class="btn btn-primary" href="{% url 'core:home' %}">Back to my dashboard</a>
</div>
{% endblock %}
